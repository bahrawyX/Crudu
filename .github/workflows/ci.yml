name: CI

on:
  push:
  pull_request:

# A second push to the same branch cancels the first. Nothing here is a
# deployment, so an in-flight run on a superseded commit is pure waste.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile so a lockfile that drifted from package.json fails
      # here rather than resolving to something nobody tested locally.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every step runs even if an earlier one failed. A run that reports "lint
      # broke" and hides three test failures costs a second round trip.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: error
